name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Postgres de verdade: os testes marcados com `integracao` exercitam o
    # dialeto real (enum nativo, cascade, contagem agregada). Rodar em SQLite
    # daria confianca falsa justamente onde a costura com o banco importa.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grudado
          POSTGRES_PASSWORD: grudado
          POSTGRES_DB: grudado_teste
        options: >-
          --health-cmd "pg_isready -U grudado -d grudado_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app tests
      - run: pytest -q
        env:
          DATABASE_URL_TESTE: postgresql+psycopg://grudado:grudado@localhost:5432/grudado_teste

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Falha so em vulnerabilidade critica. O advisory alto aberto hoje
      # (react-router em modo RSC) nao alcanca uma SPA Vite -- ver README.
      - run: npm audit --audit-level=critical

  contrato:
    name: Contrato backend/frontend (tipos do OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: npm ci
        working-directory: frontend

      - name: Exportar OpenAPI do backend
        run: python scripts/export_openapi.py
        working-directory: backend

      - name: Regerar os tipos TypeScript
        run: npm run gen:api
        working-directory: frontend

      - name: Falhar se os tipos commitados estiverem defasados
        run: |
          if ! git diff --exit-code -- src/types/api.d.ts; then
            echo "::error::Os tipos gerados estao defasados. Rode 'python backend/scripts/export_openapi.py' e 'npm run gen:api' no frontend, e commite o resultado."
            exit 1
          fi
        working-directory: frontend
